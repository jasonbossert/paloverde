[project]
name = "paloverde"
dynamic = ["version"]
description = "A JIT-compiling geospatial processing engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "paloverde._paloverde"
python-source = "python/src"
manifest-path = "crates/paloverde-python/Cargo.toml"
features = ["gpu"]

[dependency-groups]
dev = [
    "maturin>=1.16.0",
    "pytest>=9.2.0",
]
